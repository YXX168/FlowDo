name: Build FlowDo APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowdo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Generate Android project structure
        run: flutter create --platforms android --org com.flowdo --project-name flowdo .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build APK (ARM64)
        run: flutter build apk --target-platform android-arm64 --split-per-abi --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: flowdo-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
