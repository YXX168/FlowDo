name: Build FlowDo APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Generate Android project structure
        run: flutter create --platforms android --org com.flowdo --project-name flowdo .

      - name: Install dependencies
        run: flutter pub get

      - name: Verify shader assets
        run: |
          echo "=== Checking shader files ==="
          ls -la shaders/
          echo "=== Pubspec shader declaration ==="
          grep -A2 "shaders:" pubspec.yaml

      - name: Build APK (ARM64)
        run: flutter build apk --target-platform android-arm64 --split-per-abi --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowdo-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Show build info
        run: |
          echo "=== Build Complete ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== APK Info ==="
          file build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
